[pytest]
pythonpath = .
testpaths = tests
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::FutureWarning
markers =
    live_ollama: requires a running Ollama with qwen2.5vl:3b
    live_media: requires Tesseract / Whisper and real media files
    slow: takes more than ~30 seconds
